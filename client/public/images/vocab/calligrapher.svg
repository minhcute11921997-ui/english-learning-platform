<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="28" fill="url(#grad_28)"/>
  
  <!-- Subtle Canvas Texture / Geometric Motif -->
  <circle cx="50" cy="50" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="350" cy="350" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="360" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Category Pill Badge -->
  <g transform="translate(200, 52)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="4" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="10" font-weight="bold" fill="#c7d2fe" text-anchor="middle" letter-spacing="2">FINE ARTS & CRAFTS</text>
  </g>

  <!-- Central Discipline Illustration -->
  <g filter="url(#shadow)">
    
      <!-- Calligraphy Brush & Scroll -->
      <path d="M150 170 C170 140, 230 140, 250 170 C240 220, 160 220, 150 270" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
      <line x1="220" y1="130" x2="170" y2="250" stroke="#fde047" stroke-width="6" stroke-linecap="round"/>
      <circle cx="170" cy="250" r="7" fill="#ef4444"/>
    
  </g>

  <!-- English Vocabulary Title -->
  <text x="200" y="325" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">CALLIGRAPHER</text>

  <!-- Vietnamese Meaning & Reference Tag -->
  <text x="200" y="352" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">nhà thư pháp</text>
  <text x="200" y="374" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#c7d2fe" text-anchor="middle" font-style="italic">Ref: Oxford Art Dictionary</text>
</svg>