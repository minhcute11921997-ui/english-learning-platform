name: EngLearn CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-and-build:
    name: Unit Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install server dependencies
        working-directory: server
        run: npm ci || npm install --no-audit --no-fund

      - name: Install client dependencies
        working-directory: client
        run: npm ci || npm install --no-audit --no-fund

      - name: Run Regression, SM-2 & Frontend tests
        run: npm test

      - name: Run Client Lint
        working-directory: client
        run: npm run lint --if-present

      - name: Build Client Production Bundle
        working-directory: client
        run: npm run build

  mysql-integration:
    name: MySQL 8 Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: english_learning_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install server dependencies
        working-directory: server
        run: npm ci || npm install --no-audit --no-fund

      - name: Run MySQL Integration Tests
        env:
          NODE_ENV: test
          RUN_MYSQL_TESTS: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: test_root_password
          DB_NAME: english_learning
          DB_NAME_TEST: english_learning_test
        run: npm run test:mysql
