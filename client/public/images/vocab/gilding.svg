<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="28" fill="url(#grad_18)"/>
  
  <!-- Subtle Canvas Texture / Geometric Motif -->
  <circle cx="50" cy="50" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="350" cy="350" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="360" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Category Pill Badge -->
  <g transform="translate(200, 52)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="4" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="10" font-weight="bold" fill="#fde68a" text-anchor="middle" letter-spacing="2">FINE ARTS & CRAFTS</text>
  </g>

  <!-- Central Discipline Illustration -->
  <g filter="url(#shadow)">
    
    <!-- Fine Art Emblem -->
    <circle cx="200" cy="200" r="55" fill="rgba(255,255,255,0.18)" stroke="white" stroke-width="4"/>
    <polygon points="200,160 235,225 165,225" fill="none" stroke="#fde047" stroke-width="4"/>
    <circle cx="200" cy="200" r="12" fill="white"/>
  
  </g>

  <!-- English Vocabulary Title -->
  <text x="200" y="325" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">GILDING</text>

  <!-- Vietnamese Meaning & Reference Tag -->
  <text x="200" y="352" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">kỹ thuật dát vàng lá mỹ nghệ</text>
  <text x="200" y="374" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#fde68a" text-anchor="middle" font-style="italic">Ref: Oxford Art Dictionary</text>
</svg>