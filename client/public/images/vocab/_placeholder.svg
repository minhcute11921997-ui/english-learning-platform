<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F4" />
      <stop offset="100%" stop-color="#E7E5E4" />
    </linearGradient>
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#artBg)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#D6D3D1" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Center Art Palette & Brush Icon -->
  <g transform="translate(140, 75)">
    <!-- Palette base -->
    <path d="M 60 10 C 25 10, 5 35, 5 65 C 5 105, 35 125, 65 125 C 75 125, 85 115, 85 105 C 85 95, 95 90, 105 90 C 115 90, 125 98, 125 110 C 125 115, 122 120, 120 125 C 145 115, 155 85, 155 60 C 155 30, 115 10, 60 10 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3" />
    
    <!-- Paint dabs -->
    <circle cx="35" cy="45" r="8" fill="#EF4444" opacity="0.8" />
    <circle cx="65" cy="30" r="8" fill="#3B82F6" opacity="0.8" />
    <circle cx="95" cy="40" r="8" fill="#10B981" opacity="0.8" />
    <circle cx="120" cy="65" r="8" fill="#F59E0B" opacity="0.8" />
    
    <!-- Thumb hole -->
    <ellipse cx="40" cy="85" rx="10" ry="14" fill="#F5F5F4" stroke="#94A3B8" stroke-width="2" />

    <!-- Brush leaning across -->
    <path d="M 10 135 L 140 20" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
    <path d="M 132 28 L 145 15" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />
    <path d="M 143 17 L 152 8" stroke="#D97706" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Fine Arts Label -->
  <text x="200" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#78716C" text-anchor="middle">
    Fine Arts &amp; Crafts Illustration
  </text>
  <text x="200" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#A8A29E" text-anchor="middle">
    Tác phẩm nghệ thuật thị giác
  </text>
</svg>
